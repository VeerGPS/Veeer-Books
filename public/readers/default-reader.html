<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veeer Books Digital Reader</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #c5a059;
      --border: #334155;
    }
    body.light-theme {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
    }
    body.sepia-theme {
      --bg: #fbf0d9;
      --card: #f4e4bc;
      --text: #5f4b32;
      --muted: #8c7355;
      --border: #dfd0b5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s, color 0.3s;
    }
    header {
      background-color: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { font-size: 1.2rem; font-weight: 700; color: var(--accent); text-decoration: none; }
    .controls { display: flex; gap: 0.75rem; align-items: center; }
    .btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 2rem auto;
      padding: 2.5rem;
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      line-height: 1.8;
      font-size: 1.1rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    h1 { font-size: 2rem; color: var(--accent); margin-bottom: 0.5rem; }
    .author { color: var(--muted); margin-bottom: 2rem; font-style: italic; }
    p { margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <header>
    <a href="/library" class="brand">← Veeer Books Reader</a>
    <div class="controls">
      <button class="btn" onclick="toggleTheme('dark')">🌙 Dark</button>
      <button class="btn" onclick="toggleTheme('sepia')">📜 Sepia</button>
      <button class="btn" onclick="toggleTheme('light')">☀️ Light</button>
    </div>
  </header>
  <main>
    <h1 id="book-title">Digital Edition</h1>
    <div class="author" id="book-author">Veeer Sukhadiya</div>
    <div id="book-content">
      <p>Welcome to your digital reading experience. This eBook is now unlocked in your digital library.</p>
    </div>
  </main>
  <script>
    function toggleTheme(theme) {
      document.body.className = theme + '-theme';
    }
  </script>
</body>
</html>
