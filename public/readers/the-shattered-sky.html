<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Shattered Sky — Veer Sukhadiya</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent:    #5b8fc5;
  --bg:        #252830;
  --toolbar-bg:#1a1a1a;
  --toolbar-br:#2e2e2e;
  --btn-bd:    #444;
  --btn-cl:    #ccc;
}

html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: Georgia, serif; transition: background .25s; }

/* Colour modes */
body.sepia  { --bg:#3b2e1e; --toolbar-bg:#251e14; --toolbar-br:#4a3822; }
body.night  { --bg:#111;    --toolbar-bg:#0d0d0d; --toolbar-br:#222;    }

/* Shell */
#shell { display:flex; flex-direction:column; height:100vh; width:100vw; }

/* Toolbar */
#toolbar {
  flex-shrink:0; height:52px; background:var(--toolbar-bg);
  border-bottom:1px solid var(--toolbar-br);
  display:flex; align-items:center; padding:0 .75rem; gap:.4rem;
  z-index:20; overflow-x:auto; overflow-y:hidden; scrollbar-width:none;
}
#toolbar::-webkit-scrollbar { display:none; }

.sep { width:1px; height:24px; background:#333; flex-shrink:0; margin:0 .1rem; }

.tb-btn {
  flex-shrink:0; background:transparent; border:1px solid var(--btn-bd);
  color:var(--btn-cl); font-size:.78rem; padding:.3rem .65rem; border-radius:5px;
  cursor:pointer; white-space:nowrap; transition:background .15s,border-color .15s,color .15s;
  font-family:inherit;
}
.tb-btn:hover:not(:disabled) { background:#333; border-color:#666; color:#fff; }
.tb-btn:disabled { opacity:.3; cursor:default; }
.tb-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }

#page-counter { color:#999; font-size:.78rem; min-width:72px; text-align:center; flex-shrink:0; }
#book-title   { color:#777; font-style:italic; font-size:.78rem; flex:1; text-align:center;
                  overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
                  padding:0 .25rem; min-width:0; }
#zoom-lbl     { color:#888; font-size:.75rem; min-width:34px; text-align:center; flex-shrink:0; }

/* Viewport */
#viewport {
  flex:1; overflow:auto; display:flex; align-items:flex-start;
  justify-content:center; padding:1.25rem; gap:10px;
  background:var(--bg); transition:background .25s, padding-left .28s ease;
}

/* Page images */
.pg {
  display:block; height:auto; border-radius:3px; flex-shrink:0;
  box-shadow:0 8px 40px rgba(0,0,0,.7); user-select:none; -webkit-user-drag:none;
  transform-origin:top center; transition:filter .25s;
}

/* Single page */
body:not(.two-page) #img-l { max-width:min(100%,720px); width:auto; }
body:not(.two-page) #img-r { display:none !important; }

/* Two-page spread */
body.two-page #img-l,
body.two-page #img-r { max-width:calc(50% - 5px); width:calc(50% - 5px); }
body.two-page.cover-solo #img-l { max-width:min(100%,720px); width:auto; }
body.two-page.cover-solo #img-r { display:none !important; }

/* Night: invert pages | Sepia: warm tint */
body.night .pg { filter:invert(1) hue-rotate(180deg); }
body.sepia .pg  { filter:sepia(.5) brightness(.97); }

/* Thumbnail strip */
#thumb-strip {
  position:fixed; top:52px; left:0; width:118px;
  height:calc(100vh - 52px); background:#111; border-right:1px solid #222;
  overflow-y:auto; padding:.4rem; display:flex; flex-direction:column; gap:.3rem;
  transform:translateX(-100%); transition:transform .28s ease; z-index:15;
  scrollbar-width:thin; scrollbar-color:#333 #111;
}
#thumb-strip.open { transform:translateX(0); }
body.thumbs-open #viewport { padding-left:calc(118px + 1.25rem); }

.thumb { cursor:pointer; border-radius:3px; overflow:hidden; border:2px solid transparent;
          transition:border-color .12s; position:relative; flex-shrink:0; }
.thumb:hover  { border-color:#555; }
.thumb.active { border-color:var(--accent); }
.thumb img    { display:block; width:100%; height:auto; pointer-events:none; }
.thumb-lbl { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.55);
              color:#ccc; font-size:.58rem; text-align:center; padding:1px 0; }

@media(max-width:600px) { #book-title{ display:none; } #viewport{ padding:.5rem; } }
</style>
</head>
<body>
<div id="shell">

  
    <button class="tb-btn" id="btn-prev">◀ Prev</button>
    <span   id="page-counter">1 / 52</span>
    <button class="tb-btn" id="btn-next">Next ▶</button>
    <div class="sep"></div>
    <span id="book-title">The Shattered Sky — Veer Sukhadiya</span>
    <div class="sep"></div>
    <button class="tb-btn" id="btn-thumbs">☰</button>
    <div class="sep"></div>
    <button class="tb-btn" id="btn-zoom-out">A−</button>
    <span   id="zoom-lbl">100%</span>
    <button class="tb-btn" id="btn-zoom-in">A+</button>
    <div class="sep"></div>
    <button class="tb-btn" id="btn-1page">1 Page</button>
    <button class="tb-btn" id="btn-2page">2 Pages</button>
    <div class="sep"></div>
    <button class="tb-btn" id="btn-sepia">Sepia</button>
    <button class="tb-btn" id="btn-night">🌙 Night</button>
  </div>

  

  <div id="viewport">
    <img id="img-l" class="pg" src="" alt="Page" draggable="false">
    <img id="img-r" class="pg" src="" alt=""     draggable="false" style="display:none">
  </div>

</div>

</body>
</html>
